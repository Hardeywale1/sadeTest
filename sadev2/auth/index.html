<title>Sign up or log in | Sadé</title></head><body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen pt-safe pb-safe">
<main class="min-h-screen px-margin py-space-lg flex flex-col">
  <div class="flex items-center justify-between">
    <a href="/" aria-label="Back" class="w-11 h-11 rounded-full flex items-center justify-center text-primary hover:bg-surface-container-high"><span class="material-symbols-outlined">arrow_back</span></a>
    <div class="font-headline-sm text-headline-sm text-primary">Sadé</div>
    <div class="w-11"></div>
  </div>
  <section class="mt-space-lg">
    <div class="w-12 h-12 rounded-2xl bg-primary text-on-primary flex items-center justify-center mb-space-md"><span class="material-symbols-outlined text-[26px]">spa</span></div>
    <h1 id="auth-title" class="font-headline-lg text-headline-lg">Create your account</h1>
    <p id="auth-subtitle" class="mt-1 text-on-surface-variant">Start tracking and keep your health information together.</p>
  </section>
  <div class="mt-space-lg grid grid-cols-2 p-1 rounded-full bg-surface-container-high" role="tablist" aria-label="Account access">
    <button id="tab-signup" role="tab" aria-selected="true" class="h-11 rounded-full bg-primary text-on-primary font-semibold">Sign up</button>
    <button id="tab-login" role="tab" aria-selected="false" class="h-11 rounded-full text-on-surface-variant font-semibold">Log in</button>
  </div>
  <div class="mt-space-sm rounded-xl bg-secondary-container px-3 py-2.5 flex gap-2 text-on-secondary-fixed"><span class="material-symbols-outlined text-[18px]">info</span><p class="text-sm">Prototype only. Use placeholder details.</p></div>

  <form id="signup-panel" class="mt-space-lg space-y-space-md">
    <label class="block"><span class="font-label-lg text-label-lg">Full name</span><input autocomplete="off" placeholder="e.g. Tola Adesina" class="mt-2 w-full h-13 px-4 py-3 rounded-xl bg-surface-container-lowest border border-outline-variant focus:outline-none focus:border-primary" /></label>
    <label class="block"><span class="font-label-lg text-label-lg">Email address</span><input type="email" autocomplete="off" placeholder="name@email.com" class="mt-2 w-full h-13 px-4 py-3 rounded-xl bg-surface-container-lowest border border-outline-variant focus:outline-none focus:border-primary" /></label>
    <label class="block"><span class="font-label-lg text-label-lg">Create password</span><div class="relative mt-2"><input id="signup-password" type="password" autocomplete="new-password" placeholder="At least 8 characters" class="w-full h-13 px-4 py-3 pr-12 rounded-xl bg-surface-container-lowest border border-outline-variant focus:outline-none focus:border-primary" /><button type="button" class="toggle-password absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 text-on-surface-variant" data-target="signup-password" aria-label="Show password"><span class="material-symbols-outlined">visibility</span></button></div></label>
    <label class="flex items-start gap-3 text-sm text-on-surface-variant"><input type="checkbox" class="mt-1 accent-primary" /><span>I agree to the Terms and Privacy Notice.</span></label>
    <button id="create-account-btn" type="submit" class="w-full h-[52px] rounded-full bg-primary text-on-primary font-semibold shadow-md">Create account</button>
    <div class="flex items-center gap-3"><span class="h-px flex-1 bg-outline-variant"></span><span class="text-sm text-on-surface-variant">or</span><span class="h-px flex-1 bg-outline-variant"></span></div>
    <button id="google-signup-btn" type="button" class="w-full h-[52px] rounded-full border border-outline-variant bg-surface-container-lowest font-semibold flex items-center justify-center gap-2"><span class="text-primary text-lg font-bold">G</span>Continue with Google</button>
  </form>

  <form id="login-panel" class="hidden mt-space-lg space-y-space-md">
    <label class="block"><span class="font-label-lg text-label-lg">Email address</span><input type="email" autocomplete="off" placeholder="name@email.com" class="mt-2 w-full h-13 px-4 py-3 rounded-xl bg-surface-container-lowest border border-outline-variant focus:outline-none focus:border-primary" /></label>
    <label class="block"><span class="font-label-lg text-label-lg">Password</span><div class="relative mt-2"><input id="login-password" type="password" autocomplete="current-password" placeholder="Enter your password" class="w-full h-13 px-4 py-3 pr-12 rounded-xl bg-surface-container-lowest border border-outline-variant focus:outline-none focus:border-primary" /><button type="button" class="toggle-password absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 text-on-surface-variant" data-target="login-password" aria-label="Show password"><span class="material-symbols-outlined">visibility</span></button></div></label>
    <div class="text-right"><button type="button" class="auth-demo-action text-primary font-semibold">Forgot password?</button></div>
    <button id="login-btn" type="submit" class="w-full h-[52px] rounded-full bg-primary text-on-primary font-semibold shadow-md">Log in</button>
    <button id="google-login-btn" type="button" class="w-full h-[52px] rounded-full border border-outline-variant bg-surface-container-lowest font-semibold flex items-center justify-center gap-2"><span class="text-primary text-lg font-bold">G</span>Continue with Google</button>
  </form>
  <p class="mt-auto pt-space-xl text-center text-sm text-on-surface-variant">Your information stays private and is never shared without your choice.</p>
</main><script>
(function(){
  const signup=document.getElementById('signup-panel');
  const login=document.getElementById('login-panel');
  const signupTab=document.getElementById('tab-signup');
  const loginTab=document.getElementById('tab-login');
  const title=document.getElementById('auth-title');
  const subtitle=document.getElementById('auth-subtitle');
  function mode(value){
    const isLogin=value==='login';
    signup.classList.toggle('hidden',isLogin); login.classList.toggle('hidden',!isLogin);
    signupTab.className=isLogin?'h-11 rounded-full text-on-surface-variant font-semibold':'h-11 rounded-full bg-primary text-on-primary font-semibold';
    loginTab.className=isLogin?'h-11 rounded-full bg-primary text-on-primary font-semibold':'h-11 rounded-full text-on-surface-variant font-semibold';
    signupTab.setAttribute('aria-selected',String(!isLogin));loginTab.setAttribute('aria-selected',String(isLogin));
    title.textContent=isLogin?'Welcome back':'Create your account';
    subtitle.textContent=isLogin?'Log in to continue with Sadé.':'Start tracking and keep your health information together.';
  }
  signupTab.addEventListener('click',()=>mode('signup')); loginTab.addEventListener('click',()=>mode('login'));
  if(new URLSearchParams(location.search).get('mode')==='login')mode('login');
  signup.addEventListener('submit',e=>{e.preventDefault();location.href='/onboarding_basics/';});
  login.addEventListener('submit',e=>{e.preventDefault();location.href='/home_dashboard/';});
  document.getElementById('google-signup-btn').addEventListener('click',()=>location.href='/onboarding_basics/');
  document.getElementById('google-login-btn').addEventListener('click',()=>location.href='/home_dashboard/');
  document.querySelectorAll('.toggle-password').forEach(btn=>btn.addEventListener('click',()=>{const input=document.getElementById(btn.dataset.target);input.type=input.type==='password'?'text':'password';}));
  document.querySelectorAll('.auth-demo-action').forEach(btn=>btn.addEventListener('click',()=>alert('Password recovery is simulated in this prototype.')));
})();
</script><script src="/assets/prototype-nav.js"></script></body></html>
