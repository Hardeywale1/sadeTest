<div class="mt-space-lg space-y-space-lg">
<fieldset><legend class="font-label-lg text-label-lg mb-2">How would you describe your periods?</legend><div class="choice-single grid grid-cols-2 gap-2"><button type="button" aria-pressed="true" class="min-h-[48px] rounded-xl bg-primary text-on-primary">Regular</button><button type="button" aria-pressed="false" class="min-h-[48px] rounded-xl bg-surface-container-high text-on-surface">Irregular</button><button type="button" aria-pressed="false" class="min-h-[48px] rounded-xl bg-surface-container-high text-on-surface">No periods</button><button type="button" aria-pressed="false" class="min-h-[48px] rounded-xl bg-surface-container-high text-on-surface">Not sure</button></div></fieldset>
<label class="block"><span class="font-label-lg text-label-lg">First day of your last period</span><input type="text" placeholder="DD / MM / YYYY" class="mt-2 w-full h-[52px] px-4 rounded-xl bg-surface-container-lowest border border-outline-variant" /></label>
<div class="grid grid-cols-2 gap-3"><label><span class="font-label-lg text-label-lg">Cycle length</span><div class="mt-2 relative"><input type="number" placeholder="28" class="w-full h-[52px] px-4 rounded-xl bg-surface-container-lowest border border-outline-variant" /><span class="absolute right-3 top-4 text-on-surface-variant">days</span></div></label><label><span class="font-label-lg text-label-lg">Period length</span><div class="mt-2 relative"><input type="number" placeholder="5" class="w-full h-[52px] px-4 rounded-xl bg-surface-container-lowest border border-outline-variant" /><span class="absolute right-3 top-4 text-on-surface-variant">days</span></div></label></div>
<fieldset><legend class="font-label-lg text-label-lg mb-2">Usual flow</legend><div class="choice-single grid grid-cols-4 gap-2"><button type="button" aria-pressed="false" class="min-h-[44px] rounded-xl bg-surface-container-high text-on-surface">Light</button><button type="button" aria-pressed="true" class="min-h-[44px] rounded-xl bg-primary text-on-primary">Medium</button><button type="button" aria-pressed="false" class="min-h-[44px] rounded-xl bg-surface-container-high text-on-surface">Heavy</button><button type="button" aria-pressed="false" class="min-h-[44px] rounded-xl bg-surface-container-high text-on-surface">Varies</button></div></fieldset>

document.querySelectorAll('.choice-single').forEach(group=>group.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;group.querySelectorAll('button').forEach(x=>{x.classList.remove('bg-primary','text-on-primary');x.classList.add('bg-surface-container-high','text-on-surface');x.setAttribute('aria-pressed','false');});b.classList.remove('bg-surface-container-high','text-on-surface');b.classList.add('bg-primary','text-on-primary');b.setAttribute('aria-pressed','true');}));
